name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    # A stalled toolchain should fail loudly rather than burn the job limit.
    timeout-minutes: 45

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MinGW-w64 is the toolchain this project is verified against end to end, and
      # it links a fully static .exe that runs without any redistributable.
      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      # Only the fetched sources are cached; object files are not, so a compiler
      # or flag change can never be served stale.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # Synthetic rig -> FBX -> import -> merge -> FBX/GLB -> re-parse. No GPU needed.
      - name: Pipeline self-test
        run: ctest --test-dir build --output-on-failure

      - name: Stage package
        run: |
          mkdir -p dist
          cp build/bin/FbxAnimMerger.exe dist/
          cp README.md LICENSE THIRD_PARTY_LICENSES.md dist/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: FbxAnimMerger-windows-x64
          path: dist/
          if-no-files-found: error

      - name: Package
        if: github.event_name == 'push'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath FbxAnimMerger-windows-x64.zip -Force

      # Every green build of main replaces a single rolling release, so there is
      # always a current .exe behind a stable URL. Marked as a prerelease so it never
      # displaces a real tagged version as GitHub's "Latest release".
      - name: Publish rolling build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Actions runs pwsh with ErrorActionPreference=Stop, and PowerShell 7.4+
          # turns a non-zero native exit code into a terminating error under it.
          # Probing for an existing release is expected to fail on the first run.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $short = $env:GITHUB_SHA.Substring(0, 7)
          gh release view latest --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete latest --yes --cleanup-tag
          }
          $notes = "Automatic build of main at commit $short (run #$($env:GITHUB_RUN_NUMBER)). " +
                   "Replaced on every push to main - use a tagged release if you need a fixed version."
          gh release create latest FbxAnimMerger-windows-x64.zip `
            --target $env:GITHUB_SHA `
            --prerelease `
            --title "Latest build (main)" `
            --notes $notes

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" FbxAnimMerger-windows-x64.zip `
            --title "FBX Animation Merger ${{ github.ref_name }}" --generate-notes
