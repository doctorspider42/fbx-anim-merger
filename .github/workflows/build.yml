name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every push to main is meant to end in its own release, so a main build is
  # never cancelled by the next one. Branch and PR builds still are.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    # A stalled toolchain should fail loudly rather than burn the job limit.
    timeout-minutes: 60

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The patch component of the version is the commit count, so the whole
          # history has to be here - a shallow clone would silently produce 1.
          fetch-depth: 0

      # VERSION holds MAJOR.MINOR; the commit count supplies the patch, so every
      # push to main is a new, strictly higher version without anyone editing a
      # file. A tag build uses the tag verbatim instead.
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $base = (Get-Content VERSION -Raw).Trim()
            $count = (git rev-list --count HEAD).Trim()
            $version = "$base.$count"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Derived version '$version' is not MAJOR.MINOR.PATCH"
          }
          $short = $env:GITHUB_SHA.Substring(0, 7)
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          "commit=$short"    | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Building $version ($short)"

      # MinGW-w64 is the toolchain this project is verified against end to end, and
      # it links a fully static .exe that runs without any redistributable.
      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      # Builds the installer. The runner image carries no Inno Setup of its own.
      - name: Set up Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # Only the fetched sources are cached; object files are not, so a compiler
      # or flag change can never be served stale.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DFAM_VERSION=${{ steps.version.outputs.version }}
          -DFAM_COMMIT=${{ steps.version.outputs.commit }}

      - name: Build
        run: cmake --build build --parallel

      # Synthetic rig -> FBX -> import -> merge -> FBX/GLB -> re-parse. No GPU needed.
      - name: Pipeline self-test
        run: ctest --test-dir build --output-on-failure

      # Both artifacts come out of the same binaries: a portable zip carrying the
      # PORTABLE marker, and a per-user Inno Setup installer without it.
      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: FbxAnimMerger-${{ steps.version.outputs.version }}-windows-x64
          path: dist/
          if-no-files-found: error

      # Every push to main publishes its own release, tagged v<version>, and that
      # is what the in-app updater reads through /releases/latest. A manually
      # pushed v* tag takes the same path with the tag's own number.
      #
      # The tag is created here rather than pushed, which also means no second
      # workflow run: events raised with GITHUB_TOKEN do not re-trigger workflows.
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Actions runs pwsh with ErrorActionPreference=Stop, and PowerShell 7.4+
          # turns a non-zero native exit code into a terminating error under it.
          # Probing for an existing release is expected to fail most of the time.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          # @() so a single asset still splats as one argument rather than a string.
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # A re-run of the same commit: refresh the assets rather than fail.
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets `
              --target $env:GITHUB_SHA `
              --title "FBX Animation Merger $version" `
              --generate-notes `
              --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "publishing $tag failed with exit code $LASTEXITCODE"
          }
          Write-Host "Published $tag"
