name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only the fetched sources are cached; object files are not, so a compiler
      # or flag change can never be served stale.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      # Synthetic rig -> FBX -> import -> merge -> FBX/GLB -> re-parse. No GPU needed.
      - name: Pipeline self-test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/bin/Release/FbxAnimMerger.exe dist/
          Copy-Item README.md, LICENSE, THIRD_PARTY_LICENSES.md dist/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: FbxAnimMerger-windows-x64
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/* -DestinationPath FbxAnimMerger-windows-x64.zip
          gh release create "${{ github.ref_name }}" FbxAnimMerger-windows-x64.zip `
            --title "FBX Animation Merger ${{ github.ref_name }}" --generate-notes
